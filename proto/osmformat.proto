// The parts of OSM PBF's osmformat.proto that osm-pbf-ingest reads,
// with the upstream field numbers. Fields left out (Info, DenseInfo,
// ChangeSet, HeaderBlock, the LocationsOnWays coordinates) are skipped on
// decode without being parsed. Upstream:
// https://github.com/openstreetmap/OSM-binary/blob/master/osmpbf/osmformat.proto
//
// `Relation.types` is `int32` rather than the upstream `MemberType` enum: a
// closed proto2 enum moves out-of-range values into unknown fields, which
// would shift every later member's type against its id and role. Ingest
// drops members of an unknown type itself, as osmpbfreader does.
//
// Regenerate the Rust code with scripts/gen-proto.sh after editing.
